<script>
// 당근마켓 전용 주소(posmos.net/daangn). 상담 신청 폼으로 바로 넘기면서 유입 코드 daangn 을 붙인다.
// 신청 페이지의 track-source.js 가 이 코드를 30일간 기억해 '유입 경로'·'유입 코드'를 '당근마켓'으로 보낸다.
// 링크에 utm 이 없으면 utm_source=daangn·utm_medium=social 을 붙여 GA4 세션 출처에서도 당근을 구분한다.
(function(){
  var p=new URLSearchParams(location.search);
  p.set('from','daangn');
  if(!p.get('utm_source')){
    p.set('utm_source','daangn');
    if(!p.get('utm_medium'))p.set('utm_medium','social');
  }
  location.replace('/posmos-apply.html?'+p.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/posmos-apply.html?from=daangn&amp;utm_source=daangn&amp;utm_medium=social"></noscript>

</body>
