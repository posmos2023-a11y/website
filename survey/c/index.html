<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Google Tag Manager: 운영 도메인에서만 로드 -->
<script>if(/^(www\.)?posmos\.net$/.test(location.hostname))(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-T6DNFLFK');</script>
<script src="/survey/sv.js"></script>
<title>시안 C · 채팅 대화형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0a2263;--blue:#1d5cff;--line:#cfd8e8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,system-ui,sans-serif;background:#dfe6f1;display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#bdd0e8}
header{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:13px;background:#fff;color:#2fb24a;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
header .n{font-weight:800;font-size:16.5px}header .s{font-size:12.5px;opacity:.75}
header .pg{margin-left:auto;font-size:13px;font-weight:700;background:#ffffff22;padding:5px 10px;border-radius:99px}
#log{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:flex-start;animation:up .22s ease}
.row .av{width:34px;height:34px;font-size:17px;border-radius:12px}
.row.cont .av{visibility:hidden}
.b{max-width:80%;padding:11px 14px;border-radius:4px 18px 18px 18px;background:#fff;font-size:16px;line-height:1.5;color:#1a2238}
.me{justify-content:flex-end}.me .b{background:#ffe34d;border-radius:18px 4px 18px 18px;font-weight:600}
.cardlist{display:grid;gap:6px}
.cardlist div{padding:9px 11px;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 8%,#fff);font-size:14px}
.cardlist b{color:var(--c);font-size:15.5px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:#9aa5bb;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}@keyframes up{from{opacity:0;transform:translateY(6px)}}
#pad{background:#fff;padding:12px 12px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #dde3ee}
#pad:empty{display:none}
.hint{font-size:13.5px;color:#5d6680;margin:0 2px 9px;font-weight:600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{min-height:52px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:#fff;font:inherit;font-size:15.5px;font-weight:700;color:#26314d;cursor:pointer;line-height:1.3}
.chip small{display:block;font-size:13px;font-weight:800}
.chip.on{border-color:var(--blue);background:#eef4ff;color:var(--blue)}
.chip.on::before{content:"✓ "}
.chip.full{grid-column:span 2}
.go{width:100%;height:54px;margin-top:9px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.go:disabled{background:#c9d2e6}
.go.sub{background:none;color:#5d6680;font-size:15px;font-weight:600;height:40px;margin-top:2px}
.inp input{width:100%;height:56px;padding:0 16px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:19px;font-weight:700}
.inp input:focus{outline:none;border-color:var(--blue)}
.err{color:#e0352b;font-size:13.5px;margin:5px 2px 0;min-height:17px}
.hint a{color:#5d6680}
</style></head><body>
<div class="app">
  <header><div class="av">✱</div><div><div class="n">포스모스 매니저</div><div class="s">30초 설문 · 버튼만 누르면 돼요</div></div><div class="pg" id="pg"></div></header>
  <div id="log"></div>
  <div id="pad"></div>
</div>
<script>
const P=[['위약금 없는 정수기','월 17,900원','#1d5cff'],['배민 접수하면','5만원 받기','#13a84a'],['키오스크','월 45,000원','#7b3fe4'],['테이블 오더','월 10,000원','#f26b0f']];
const NONE='아직 잘 모르겠어요';
const S=[
 {id:'want',say:['사장님, 포스모스예요 👋<br>이런 혜택을 준비했어요!',`<div class="cardlist">${P.map(p=>`<div style="--c:${p[2]}">${p[0]} <b>${p[1]}</b></div>`).join('')}</div>`,'관심 가는 걸 <b>모두</b> 골라주세요'],multi:1,
  o:[...P.map(p=>`${p[0]}<small style="color:${p[2]}">${p[1]}</small>`),NONE]},
 {id:'biz',say:['매장은 어떤 업종이세요?'],o:['음식점','카페·베이커리','주점·호프','소매·편의점','기타']},
 {id:'phone',say:['마지막이에요!<br>혜택 안내 받을 번호를 남겨주세요'],contact:1}
];
const A={};const log=document.getElementById('log'),pad=document.getElementById('pad'),pg=document.getElementById('pg');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const plain=h=>h.replace(/<small.*?<\/small>/,'');
const fmt=v=>{v=v.replace(/\D/g,'').slice(0,11);return v.length<4?v:v.length<8?v.slice(0,3)+'-'+v.slice(3):v.slice(0,3)+'-'+v.slice(3,v.length-4)+'-'+v.slice(-4)};
const okPhone=v=>/^01[016789]\d{7,8}$/.test(v.replace(/\D/g,''));
function add(html,me,cont){const r=document.createElement('div');r.className='row'+(me?' me':'')+(cont?' cont':'');
  r.innerHTML=(me?'':'<div class="av">✱</div>')+`<div class="b">${html}</div>`;log.appendChild(r);log.scrollTop=log.scrollHeight;return r;}
async function bot(lines){for(let n=0;n<lines.length;n++){const t=add('<span class="typing"><i></i><i></i><i></i></span>',0,n>0);await wait(380);t.querySelector('.b').innerHTML=lines[n];log.scrollTop=log.scrollHeight;await wait(120);}}
async function run(k){
  if(k===1||k===2)sv('step'+(k+1));pad.innerHTML='';pg.textContent=k<S.length?`${k+1}/${S.length}`:'완료';
  if(k>=S.length){await bot(['소중한 의견 감사합니다 🙏',A.phone?'남겨주신 번호로 혜택 안내드릴게요!':'더 좋은 서비스로 보답할게요!']);
    pad.innerHTML='<button class="go" onclick="location.href=\'https://posmos.net\'">포스모스 둘러보기</button>';return;}
  const s=S[k];await bot(s.say);
  if(s.contact){
    pad.innerHTML=`<div class="inp"><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000"></div><div class="err" id="err"></div>
    <div class="hint">번호는 혜택 안내에만 쓰고 안내 후 바로 파기해요. <a href="https://posmos.net/posmos-privacy.html" target="_blank">자세히</a></div>
    <button class="go" id="ok">동의하고 보내기</button>`;
    const ph=document.getElementById('ph'),err=document.getElementById('err');
    ph.oninput=()=>{ph.value=fmt(ph.value);err.textContent=''};
    const ok=()=>{if(!okPhone(ph.value)){err.textContent='휴대폰 번호를 다시 확인해 주세요';ph.focus();return;}A.phone=ph.value;svSubmit(A.want,A.biz);add(ph.value,1);run(k+1);};
    document.getElementById('ok').onclick=ok;ph.onkeydown=e=>{if(e.key==='Enter')ok()};
return;}
  pad.innerHTML=(s.multi?'<div class="hint">여러 개 골라도 돼요</div>':'')+`<div class="chips">${s.o.map((o,j)=>`<button class="chip ${j===s.o.length-1&&s.o.length%2?'full':''}" data-j="${j}">${o}</button>`).join('')}</div>${s.multi?'<button class="go" id="done" disabled>골라주세요</button>':''}`;
  const sel=new Set(),done=document.getElementById('done');
  pad.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const v=plain(s.o[b.dataset.j]);
    if(!s.multi){A[s.id]=v;add(v,1);run(k+1);return;}
    if(v===NONE){const had=sel.has(NONE);sel.clear();if(!had)sel.add(NONE);}
    else{sel.delete(NONE);sel.has(v)?sel.delete(v):sel.add(v);}
    pad.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',sel.has(plain(s.o[c.dataset.j]))));
    done.disabled=!sel.size;done.textContent=!sel.size?'골라주세요':sel.has(NONE)?'다음':`${sel.size}개 선택 완료`;});
  if(done)done.onclick=()=>{A[s.id]=[...sel];add([...sel].join(', '),1);run(k+1);};
}
run(0);
</script></body></html>
