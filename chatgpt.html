<script>
// ChatGPT 광고 전용 주소(posmos.net/chatgpt). 홈페이지로 넘기면서 유입 코드 chatgpt 를 붙인다.
// track-source.js 가 이 코드를 30일간 기억해 신청의 '유입 경로'를 'ChatGPT 광고'로 보낸다.
// 링크에 utm 이 없으면 utm_source=chatgpt·utm_medium=cpc 를 붙여 GA4 세션 출처에서도 광고를 구분한다.
(function(){
  var p=new URLSearchParams(location.search);
  p.set('from','chatgpt');
  if(!p.get('utm_source')){
    p.set('utm_source','chatgpt');
    if(!p.get('utm_medium'))p.set('utm_medium','cpc');
  }
  location.replace('/?'+p.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/?from=chatgpt&amp;utm_source=chatgpt&amp;utm_medium=cpc"></noscript>
</head>
<body>
<p><a href="/?from=chatgpt&amp;utm_source=chatgpt&amp;utm_medium=cpc">포스모스 홈페이지로 가기</a></p>
</body>
